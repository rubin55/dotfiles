# ~/.aimap.toml

[[model_evaluators]]
name = "artificial-analysis"
base_url = "https://artificialanalysis.ai/api/v2/data/llms/models"
auth_keys = [ "artificialanalysis", "default-api-token"]
auth_header = "x-api-key"

[[model_providers]]
name = "cortecs"
base_url="https://api.cortecs.ai/v1"
auth_keys = ["cortecs", "default-api-token"]

[[model_providers]]
name = "edenai"
base_url="https://api.edenai.run/v3"
auth_keys = ["edenai", "default-api-token"]
balance_login = ["edenai", "rubin@raaf.io"]
balance_token_url = "https://api.edenai.run/v2/token"
balance_account_url = "https://api.edenai.run/v2/user/account/user"
balance_field = "credits"

[[model_providers]]
name = "hetzner"
base_url="https://inference.hetzner.com/api/v1"
auth_keys = ["hetzner", "default-api-token"]

[[model_providers]]
name = "neuralwatt"
base_url="https://api.neuralwatt.com/v1"
auth_keys = ["neuralwatt", "default-api-key"]
pricing = "energy"

[[model_providers]]
name = "opencode"
base_url="https://opencode.ai/zen/v1"
auth_keys = ["opencode", "zen-api-key"]
user_agent = "opencode/stable/2.0.8/opencode"
balance_cookie = "opencode.ai/auth"
balance_page_url = "https://opencode.ai/workspace/wrk_01M1K9Y1J009VQ0W47VKHC3K0J/billing"
balance_pattern = "balance:(\\d+)"
balance_scale = 1e8

[[model_providers]]
name = "openrouter"
base_url="https://openrouter.ai/api/v1"
auth_keys = ["openrouter", "rubins-raaf-api-key"]

[[model_providers]]
name = "orcarouter"
base_url="https://api.orcarouter.ai/v1"
auth_keys = ["orcarouter", "default-api-token"]

