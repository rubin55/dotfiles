# ~/.makepkg.conf.
MAKEFLAGS="-j32"
COMPRESSZST=(zstd -c -T0 --fast -)
BUILDENV=(!distcc color !ccache check sign)
OPTIONS=(!strip docs !libtool staticlibs emptydirs zipman purge debug lto)
BUILDDIR="$HOME/.cache/makepkg"
PKGDEST="$HOME/Packaging/Repository"
SRCDEST="$HOME/Packaging/Sources"
SRCPKGDEST="$HOME/Packaging/Source Packages"
GPGKEY="14B189C4E877C9CAEA7F99C7ED3BDDB83BDD2604"
PACKAGER="Rubin Simons <me@rubin55.org>"

# For linux-tachyon:
_debug=y

# For ctranslate2-cuda:
_ctranslate2_cuda_arch_list='8.6;8.9+PTX'

# For llama.cpp-cuda-git:
_llamacpp_cuda_arch_list='8.6;8.9;12.0'

# For flycast-git:
_use_sodeps=true

# For ryujinx-git:
_autoupdate=false

# For ungoogled-chromium:
_chromium_full_debug=y

