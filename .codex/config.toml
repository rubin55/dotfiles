default_permissions = "workspace-write-net"

developer_instructions = '''
If no apply_patch tool exists, always edit and create files with the apply_patch command; do not use sed, printf, echo or shell redirection to write files. Run apply_patch with exec_command and a heredoc, on its own, not chained with other commands in the same call:

apply_patch <<'EOF'
*** Begin Patch
*** Update File: path/to/file
...
*** End Patch
EOF

If no web_search tool exists, search the web with curl through exec_command, on the DuckDuckGo HTML endpoint with a url-encoded query:

curl -s -A 'Mozilla/5.0' 'https://html.duckduckgo.com/html/?q=<query>'

Each result is a tag with class result__a. Its target URL is the url-encoded uddg parameter of the href. Then fetch the pages you need with curl. For current information, search; do not answer from memory.

Each exec_command runs in its own sandbox process namespace. When the command ends, all of its processes are killed, including daemons and background jobs. To keep a server running, start it in the foreground in a persistent exec_command session, and use it from other commands.
'''

[analytics]
enabled = false

[features]
apps = false
daemon_auto_start = false
network_proxy = false

[tools.update_plan]
enabled = true

[permissions.workspace-write-net]
description = "Workspace write with public web access."
extends = ":workspace"

[permissions.workspace-write-net.filesystem]
"/run/user/1001" = "write"
"~/.bun" = "write"
"~/.cabal" = "write"
"~/.cache" = "write"
"~/.cargo" = "write"
"~/.config/sbt" = "write"
"~/.ghcup" = "write"
"~/.gradle" = "write"
"~/.hex" = "write"
"~/.ivy2" = "write"
"~/.java" = "write"
"~/.kube/cache" = "write"
"~/.local/share/pnpm" = "write"
"~/.local/share/scalacli" = "write"
"~/.local/share/uv" = "write"
"~/.local/state/pnpm" = "write"
"~/.m2" = "write"
"~/.mix" = "write"
"~/.npm" = "write"
"~/.rustup" = "write"
"~/.sbt" = "write"
"~/.sonar" = "write"
"~/.stack" = "write"
"~/.yarn" = "write"
"~/Packaging" = "write"

[permissions.workspace-write-net.network]
enabled = true
# Linux seccomp cannot filter by path; needed for D-Bus, gpg, docker.
dangerously_allow_all_unix_sockets = true

[permissions.workspace-write-net.network.domains]
"*" = "allow"

[permissions.read-only-net]
description = "Read only with selected net access."
extends = ":read-only"

[permissions.read-only-net.filesystem]
"~/.kube/cache" = "write"
"~/.sonar" = "write"

[permissions.read-only-net.network]
enabled = true
# Linux seccomp cannot filter by path; needed for D-Bus, gpg, docker.
dangerously_allow_all_unix_sockets = true

[permissions.read-only-net.network.domains]
"*" = "allow"

[tui]
terminal_title = []
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 4

[mcp_servers.Computer]
enabled = false
command = "computer-use-linux"
args = ["mcp"]

[mcp_servers.Emacs]
enabled = false
command = "/home/rubin/Source/Rubin/scripts/python/emacs-mcp-server.py"

[mcp_servers.Figma]
enabled = false
url = "https://mcp.figma.com/mcp"

[mcp_servers.Neovim]
enabled = false
command = "nvim-mcp"

[mcp_servers.Wolfram]
enabled = false
command = "/opt/wolfram/Executables/wolfram"
args = ["-run", 'PacletSymbol["Wolfram/AgentTools","Wolfram`AgentTools`StartMCPServer"][]', "-noinit", "-noprompt"]

[mcp_servers.Wolfram.env]
MCP_SERVER_NAME = "WolframLanguage"
WOLFRAM_BASE = "/usr/share/Wolfram"
WOLFRAM_LOCALBASE = "/home/rubin/.Wolfram/Objects"
WOLFRAM_USERBASE = "/home/rubin/.Wolfram"
